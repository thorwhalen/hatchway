# claude-ai: what a claude.ai conversation (typed, or in the Claude app's voice mode) may
# ask of a machine through a custom connector served by `hatchway.mcp`.
#
# Read-first, and shaped for voice: few tools, short answers, paging for depth (every
# tool takes `offset`). The `handoff` class writes one thing only, a note into the
# owner's own annals inbox, which Claude Code sessions read back; it is reversible
# (annals keeps a bin) and touches no session.
#
# A machine adds what only it has (a snapshot file, a local index) in a private profile
# with `extends = "claude-ai"` in ~/.config/hatchway/profiles/. Nothing personal here.

name = "claude-ai"

instructions = """
Tools into the owner's own machines: their Claude Code sessions, their open loops, their \
GitHub repositories, and a handoff inbox shared with Claude Code. Often used by voice, so \
call one tool at a time, start with the overview tools (session_triage, repo_overview, \
list_issues, read_handoffs) and only then read in depth (read_repo_file, read_issue, \
session_turns). Long answers come in pages: the answer says which offset to ask for next. \
Summarise what comes back in a few spoken sentences unless asked for detail. A \
'refused:' answer means the request is outside what this connector allows; say so, do \
not retry with variations. An annals link (.../annals/d/... or .../annals/g/...) is \
private: never fetch it, read it with read_document (and document_info for its files and \
the documents it links to). post_handoff writes a note Claude Code will read: use it \
when the owner asks to pass something on, and read the title and body back first. \
create_issue and comment_issue write to GitHub: read the title and text back first; a \
'needs_approval' or 'held' answer means the publication check kept it for the owner, so \
say so and do not reword it to get past the check. message_session queues a message for one session (read it back first); it is picked up later, so follow it with intent_status. add_reminder sets a reminder for the owner at a time they said (read back the line it prints); list_reminders, close_reminder and snooze_reminder manage them. request_work asks for a job on one issue; it starts nothing: say that the owner confirms \
it on their desk with Face ID or Touch ID, and use work_status to say what became of it. It \
answers with one line for Claude Code: show that line to the owner exactly as given, on \
its own, ready to copy, and tell them to paste it into a Claude Code session.
"""

[classes.read]
# reading: always on

[classes.handoff]
# one write: a note into the owner's annals inbox, tagged `handoff` and `from-claude-ai`.
# Off until ~/.config/hatchway/allow-handoff exists. A note can carry text the
# conversation read elsewhere (an issue comment, a README), so whoever reads it treats it
# as data, never as an instruction.
requires_flag = "allow-handoff"

[classes.issue_write]
# open an issue or comment on one, through correspond, whose before_send check (the
# machine's one publication check for every writer) runs first and holds what it flags:
# nothing reaches a public repository unchecked. Create and comment only: no labels, no
# assignees, no edits. Off until ~/.config/hatchway/allow-issue-write exists; a machine's
# private profile narrows which repositories (its own accounts and organisations).
requires_flag = "allow-issue-write"

[classes.session_message]
# one write: queue a message ("work on X", "stop", "status?") for a named session, as the
# owner's console page does. It is an intent in the console store; the courier carries it
# and the session answers it, so intent_status says what became of it. Reversible (the
# session may decline, and nothing is deleted). Off until
# ~/.config/hatchway/allow-session-message exists.
requires_flag = "allow-session-message"

[classes.reminder]
# the owner's own reminders (openloops loops): set one at a time the owner said, list them,
# close or move one. A push says only "a reminder you set is due" (never --reveal: the push
# relay is public), and goes only to the owner's phone. Off until
# ~/.config/hatchway/allow-reminder exists on the machine that keeps the loops.
requires_flag = "allow-reminder"

[classes.work_request]
# one ask: queue a job on an issue for the owner to confirm in person. It starts nothing:
# the machine that keeps the request shows it to the owner, who confirms it with a passkey
# on their own surface, and only that machine starts the work, after checking the
# confirmation itself. Off until ~/.config/hatchway/allow-work-request exists.
requires_flag = "allow-work-request"

# --- Claude Code sessions on this machine (crowsnest) ---------------------------------

[[rule]]
match = ["crowsnest", "triage"]
tool = "session_triage"
argv = ["crowsnest", "triage", "--all-homes", "--quiet"]
help = "Which Claude Code sessions need the owner, which are safe to close, which are working."

[[rule]]
match = ["crowsnest", "roster"]
tool = "session_roster"
argv = ["crowsnest", "roster", "--all-homes", "--brief"]
help = "Every live Claude Code session, one line each: status, age, name, project, model."

[[rule]]
match = ["crowsnest", "recap"]
tool = "session_recap"
param = "session"
# --limit: whole replies for the owner (the page's db keeps its own 200-character clip)
argv = ["crowsnest", "recap", "--all-homes", "--limit", "1500"]
min_positional = 1
max_positional = 1
arg = "the session's name, as session_roster shows it"
help = "Five lines about one session: what it was asked, what it did, where it stands."

[[rule]]
match = ["crowsnest", "turns"]
tool = "session_turns"
param = "session"
argv = ["crowsnest", "turns", "--all-homes"]
value_flags = [{ names = ["--last", "-l"], pattern = "[0-9]{1,2}" }]
min_positional = 1
max_positional = 1
arg = "the session's name"
help = "The last few turns of one session, verbatim (last: how many, default a few)."

[[rule]]
match = ["crowsnest", "ledger"]
tool = "session_ledger"
param = "session"
argv = ["crowsnest", "ledger"]
max_positional = 1
arg = "a ledger's name; empty lists every ledger with its age"
help = "A session's ledger: what it did and decided, written by the session itself."

# --- open loops (openloops) ------------------------------------------------------------

# `ol owed` runs each issue's **Verify:** predicate, a command taken from an issue body:
# a remote request never runs one (--no-verify), so every predicate row reads `?` here.
# `ol blocked` runs nothing from issue bodies (it resolves dependency edges through the
# API), so it takes no such flag and gets none.

[[rule]]
match = ["ol", "owed"]
tool = "owed_by_owner"
argv = ["ol", "owed", "--no-verify"]
value_flags = [{ names = ["--limit", "-l"], pattern = "[0-9]{1,3}" }]
help = "What the owner still owes their agents: open manual tasks, decisions, approvals (limit: how many, default 50; a count marked as a floor means there are more). Predicates are never run from here, so 'done' cannot show: '?' means not checked, not owed."

[[rule]]
match = ["ol", "blocked"]
tool = "blocked_work"
argv = ["ol", "blocked"]
value_flags = [{ names = ["--limit", "-l"], pattern = "[0-9]{1,3}" }]
help = "Work that is blocked on another repository, and work whose blockers all closed ('ready': free to start, and nobody was told). limit: how many candidates to resolve."

# --- reminders (openloops loops) ---------------------------------------------------------
# A reminder is a loop with a time: `ol remind` saves it and schedules a push to the
# owner's phone at that time, which fires even if the machine sleeps. The title is never
# revealed in the push (no --reveal). The connector routes these to the machine that keeps
# the loops.

[[rule]]
match = ["ol", "remind"]
tool = "add_reminder"
class = "reminder"
param = "title"
argv = ["ol", "remind", "--source", "claude-ai"]
value_flags = [
  { names = ["--when", "-w"], pattern = "[0-9]{1,3}[mhd](?:[0-9]{1,2}m)?|[0-9]{1,2}:[0-9]{2}|[0-9]{4}-[0-9]{2}-[0-9]{2}(?:T[0-9]{2}:[0-9]{2})?" },
]
min_positional = 1
max_positional = 1
positional_pattern = "[A-Za-z0-9À-ſ][A-Za-z0-9À-ſ ,.:;'?!()#/+@_=-]{0,159}"
arg = "what to be reminded of, in a few words (no names of clients or secrets)"
help = "Set a reminder (title; when: 20m, 3h, 2d, 15:30, 2026-11-21 or 2026-11-21T09:00, in the owner's zone; no when means listed, never pushed). Read back the line it prints, word for word: it is how the owner catches a misheard time."

[[rule]]
match = ["ol", "loops"]
tool = "list_reminders"
argv = ["ol", "loops"]
value_flags = [{ names = ["--state", "-s"], pattern = "open|closed|completed|all" }]
help = "The owner's reminders and open loops, soonest first (state: open by default, closed, completed or all). Each line starts with its id."

[[rule]]
match = ["ol", "done"]
tool = "close_reminder"
class = "reminder"
param = "reminder"
argv = ["ol", "done", "--note", "closed from claude.ai"]
min_positional = 1
max_positional = 1
positional_pattern = "(?:loop-)?[0-9]{8}-[0-9a-f]{1,8}"
arg = "the reminder's id as list_reminders shows it (loop-YYYYMMDD-xxxxxx)"
help = "Close a reminder as done; its push is cancelled (one already scheduled may still arrive: say so)."

[[rule]]
match = ["ol", "snooze"]
tool = "snooze_reminder"
class = "reminder"
param = "reminder_and_when"
argv = ["ol", "snooze"]
min_positional = 2
max_positional = 2
positional_pattern = "(?:loop-)?[0-9]{8}-[0-9a-f]{1,8}|[0-9]{1,3}[mhd](?:[0-9]{1,2}m)?|[0-9]{1,2}:[0-9]{2}|[0-9]{4}-[0-9]{2}-[0-9]{2}(?:T[0-9]{2}:[0-9]{2})?"
arg = "the reminder's id, then the new time (20m, 3h, 15:30, 2026-11-21T09:00)"
help = "Move a reminder to a new time. Read back the line it prints."

# --- GitHub repositories (gh, read only) -----------------------------------------------
# Repository names are checked against a pattern that refuses '..' and any repository
# whose name contains 'secret'; file paths may not start a segment with '.', so dotfiles
# (.env, .npmrc) are never read; search text may not carry qualifiers (no ':'). A name
# check cannot see a renamed repository: a machine should also narrow the owners in its
# private profile (extends = "claude-ai"), and the strongest guard is a gh token that
# cannot read what must stay unread.

[[rule]]
match = ["gh", "repo", "list"]
tool = "list_repos"
param = "owner"
argv = ["gh", "repo", "list"]
value_flags = [{ names = ["--limit", "-L"], pattern = "[0-9]{1,3}" }]
max_positional = 1
positional_pattern = "[A-Za-z0-9][A-Za-z0-9-]{0,38}"
arg = "an owner or organisation; empty means the owner's own account"
help = "Repositories of an owner, most recently updated first, with descriptions."

[[rule]]
match = ["gh", "repo", "view"]
tool = "repo_overview"
param = "repo"
argv = ["gh", "repo", "view"]
min_positional = 1
max_positional = 1
positional_pattern = "(?!.*\\.\\.)(?!(?i:.*secret))[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9_.-]{1,100}"
arg = "OWNER/REPO"
help = "A repository's description and README: the place to start on any repo."

[[rule]]
match = ["gh", "api", "contents"]
tool = "read_repo_file"
param = "path"
argv = ["gh", "api", "--method", "GET", "-H", "Accept: application/vnd.github.raw+json"]
min_positional = 1
max_positional = 1
positional_pattern = "(?!.*\\.\\.)(?!(?i:.*secret))repos/[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9_.-]{1,100}/contents(/[A-Za-z0-9_@+=, -][A-Za-z0-9_.@+=, -]{0,199}){0,12}"
arg = "repos/OWNER/REPO/contents/PATH (a folder gives its listing as JSON)"
help = "One file of a repository, or a folder's listing. Long files come in pages."

[[rule]]
match = ["gh", "issue", "list"]
tool = "list_issues"
argv = ["gh", "issue", "list"]
value_flags = [
  { names = ["--repo", "-R"], pattern = "(?!.*\\.\\.)(?!(?i:.*secret))[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9_.-]{1,100}" },
  { names = ["--state", "-s"], pattern = "open|closed|all" },
  { names = ["--limit", "-L"], pattern = "[0-9]{1,3}" },
  { names = ["--search", "-S"], pattern = "(?!(?i:.*secret))[A-Za-z0-9 _.@#-]{1,120}" },
]
help = "Issues of a repository (repo: OWNER/REPO; state: open, closed or all; search: words)."

[[rule]]
match = ["gh", "issue", "view"]
tool = "read_issue"
param = "number"
# --json skips the deprecated Projects (classic) field that plain `gh issue view` queries
argv = ["gh", "issue", "view", "--json", "number,title,state,author,labels,body,url,createdAt,closedAt,comments"]
value_flags = [
  { names = ["--repo", "-R"], pattern = "(?!.*\\.\\.)(?!(?i:.*secret))[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9_.-]{1,100}" },
]
min_positional = 1
max_positional = 1
positional_pattern = "[0-9]{1,7}"
arg = "the issue number"
help = "One issue in full, with its discussion, as JSON (repo: OWNER/REPO)."

# --- the handoff inbox (annals), shared with Claude Code -------------------------------

[[rule]]
match = ["annals", "ls", "handoffs"]
tool = "read_handoffs"
argv = ["annals", "ls", "--tag", "handoff"]
value_flags = [
  { names = ["--since"], pattern = "[0-9]{1,4}[hd]|[0-9]{4}-[0-9]{2}-[0-9]{2}" },
  { names = ["--limit", "-l"], pattern = "[0-9]{1,3}" },
]
help = "Handoff notes, newest first (since: 6h, 2d or a date). Read one with read_document."

# An annals link names its own annals: the machine's annals config matches its host against
# the places it can read (the owner's annals and any [targets.NAME]), so one rule serves
# every annals the machine is configured for, and the pattern names no host. Only https
# links to a document (/d/<id>) or a group (/g/<id>), or a bare id; never '..' or userinfo.

[[rule]]
match = ["annals", "aggregate"]
tool = "read_document"
param = "document"
argv = ["annals", "aggregate"]
min_positional = 1
max_positional = 1
positional_pattern = "(?!.*\\.\\.)(?:[A-Za-z0-9][A-Za-z0-9_-]{0,127}|https://[A-Za-z0-9.-]{1,253}(?::[0-9]{1,5})?(?:/[A-Za-z0-9_.-]{1,64}){0,6}/[dg]/[A-Za-z0-9][A-Za-z0-9_-]{0,127}/?)(?:@[0-9]{1,4})?(?:[?#][A-Za-z0-9_.=&/+-]{0,200})?"
arg = "an annals link (.../annals/d/<id> or .../annals/g/<id>) exactly as you were handed it, or an id from read_handoffs"
help = "The text of an annals document, or of every document in a group (a handoff note, a report). Attached text and PDF files are included; images are named, not shown."

[[rule]]
match = ["annals", "show"]
tool = "document_info"
param = "document"
argv = ["annals", "show"]
min_positional = 1
max_positional = 1
positional_pattern = "(?!.*\\.\\.)(?:[A-Za-z0-9][A-Za-z0-9_-]{0,127}|https://[A-Za-z0-9.-]{1,253}(?::[0-9]{1,5})?(?:/[A-Za-z0-9_.-]{1,64}){0,6}/[dg]/[A-Za-z0-9][A-Za-z0-9_-]{0,127}/?)(?:@[0-9]{1,4})?(?:[?#][A-Za-z0-9_.=&/+-]{0,200})?"
arg = "an annals link (.../annals/d/<id> or .../annals/g/<id>), or an id"
help = "An annals document's details: its files, tags, the groups it is in, and links (the other annals documents and groups it links to; read them with read_document). A group's link lists its documents."

[[rule]]
match = ["annals", "publish", "handoff"]
tool = "post_handoff"
class = "handoff"
argv = ["annals", "publish", "-", "--tags", "handoff,from-claude-ai", "--session", "claude-ai"]
value_flags = [
  { names = ["--title"], free = true },
  { names = ["--text"], free = true },
]
stdin = "--text"
reply = """Posted: {out}
Line to paste into Claude Code:
Read the handoff {out} with `annals aggregate {out}` and act on it."""
help = "Leave a note for Claude Code: title and markdown text, up to about 7000 characters (decisions, next steps, links). Returns the line to paste into Claude Code."

# --- console intents: what became of one (read-only; queueing one is never offered here) --

[[rule]]
match = ["crowsnest", "intent", "status"]
tool = "intent_status"
param = "intent"
argv = ["crowsnest", "intent", "status"]
min_positional = 1
max_positional = 1
positional_pattern = "[0-9]{8}T[0-9]{6}Z-[0-9a-f]{8}|key-[0-9a-f]{32}"
arg = "the intent's id"
help = "Whether a message queued for a session was picked up: queued, handed, done or failed, with its one-line answer."

[[rule]]
match = ["crowsnest", "intent", "put"]
tool = "message_session"
class = "session_message"
param = "session"
argv = ["crowsnest", "intent", "put", "tell"]
value_flags = [
  { names = ["--text"], free = true },
  { names = ["--idempotency-key"], pattern = "[A-Za-z0-9_.-]{1,64}" },
]
stdin = "--text"
min_positional = 1
max_positional = 1
positional_pattern = "[A-Za-z0-9][A-Za-z0-9_.-]{0,63}(?:@[A-Za-z0-9_-]{1,32})?"
arg = "the session's name, as session_roster shows it"
help = "Send a message to one Claude Code session (text: what to do, e.g. 'work on X', 'stop', 'reply with your status'). Queued, not instant: the answer is an intent id; use intent_status to see whether it was picked up."

# --- work requests: a job on an issue, confirmed by the owner in person ----------------

[[rule]]
match = ["equerry-desk", "request-work"]
tool = "request_work"
class = "work_request"
argv = ["equerry-desk", "request-work"]
value_flags = [
  { names = ["--repo"], pattern = "(?!.*\\.\\.)[A-Za-z0-9][A-Za-z0-9_.-]{0,99}/[A-Za-z0-9_.-]{1,100}" },
  { names = ["--number"], pattern = "[0-9]{1,7}" },
  { names = ["--model"], pattern = "sonnet|opus" },
]
help = "Ask for a job on one issue (repo: OWNER/REPO, number). Starts nothing until the owner confirms it with a passkey on their desk."

[[rule]]
match = ["equerry-desk", "request-status"]
tool = "work_status"
param = "request"
argv = ["equerry-desk", "request-status"]
min_positional = 1
max_positional = 1
positional_pattern = "[0-9a-f]{12}"
arg = "the request id request_work gave"
help = "What became of a work request: queued, started, declined, refused or expired."

# --- issue writes: open an issue or comment, through the publication check ----------------

[[rule]]
match = ["correspond", "send", "issue"]
tool = "create_issue"
class = "issue_write"
param = "repo"
argv = ["correspond", "send"]
value_flags = [
  { names = ["--title", "-t"], free = true },
  { names = ["--text"], free = true },
  { names = ["--idempotency-key"], pattern = "[A-Za-z0-9_.-]{1,64}" },
]
stdin = "--text"
tail = ["-"]
min_positional = 1
max_positional = 1
# Matches no repository here: each machine's private profile names the repositories it
# may write to (whose only readers are the owner, unless its publication check covers
# every audience). A machine that turns the flag on without narrowing writes nowhere.
positional_pattern = "(?!)"
arg = "github:OWNER/REPO"
help = "Open an issue (title, text in markdown). The machine's publication check runs first; what it flags is held for the owner, not posted."

[[rule]]
match = ["correspond", "send", "comment"]
tool = "comment_issue"
class = "issue_write"
param = "issue"
argv = ["correspond", "send"]
value_flags = [
  { names = ["--text"], free = true },
  { names = ["--idempotency-key"], pattern = "[A-Za-z0-9_.-]{1,64}" },
]
stdin = "--text"
tail = ["-"]
min_positional = 1
max_positional = 1
# Matches no repository here: each machine's private profile names the repositories it
# may write to (whose only readers are the owner, unless its publication check covers
# every audience). A machine that turns the flag on without narrowing writes nowhere.
positional_pattern = "(?!)"
arg = "github:OWNER/REPO#NUMBER"
help = "Comment on an issue or pull request. The machine's publication check runs first; what it flags is held for the owner, not posted."
